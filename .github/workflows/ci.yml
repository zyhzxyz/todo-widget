name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:tauri-versions
      - run: npm run test:tools
      - run: npm test
      - run: npm run test:server
      - run: npm run typecheck
      - run: npm run typecheck:server
      - run: npm run typecheck:tests
      - run: npm run build
      - run: npm run test:plugin
      - run: npm run package:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: astrbot-plugin-todo-widget
          path: artifacts/astrbot_plugin_todo_widget.zip
          if-no-files-found: error
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r tools/requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -f deploy/Dockerfile -t todo-widget-api:integration-test .
      # Random test tokens, a separate Compose project/volume and simulated OneBot.
      # Never needs production secrets or access to a real QQ account.
      - run: npm run test:e2e -- --docker-image todo-widget-api:integration-test --browser
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: todo-widget-windows
          path: src-tauri/target/release/todo-widget.exe
          if-no-files-found: error
