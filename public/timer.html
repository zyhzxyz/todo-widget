<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务计时</title>
    <style>
      :root { --widget-tint: 44, 62, 80; --accent: 94, 163, 255; color: rgba(255,255,255,.9); font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
      .timer-content { display: flex; gap: 8px; width: 100%; height: 100%; padding: 10px; border-radius: 16px; border: 1px solid rgba(194,215,230,.2); background: linear-gradient(180deg,rgba(var(--widget-tint),.72),rgba(20,27,34,.6)),rgba(13,19,25,.54); backdrop-filter: blur(18px) saturate(132%); }
      .timer-body { display: flex; flex: 1; flex-direction: column; justify-content: center; min-width: 0; gap: 4px; cursor: grab; }
      .timer-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: rgba(255,255,255,.7); }
      .timer-display { font-size: 23px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; color: rgb(var(--accent)); }
      .timer-status { margin: 0; font-size: 10px; line-height: 1.25; color: rgba(255,255,255,.65); }
      .timer-status.error { color: #ffd8a8; }
      .timer-controls { display: flex; flex-direction: column; gap: 5px; flex: 0 0 51px; }
      button { display: flex; align-items: center; justify-content: center; gap: 3px; flex: 1; padding: 0; border: 0; border-radius: 8px; background: rgba(var(--accent),.14); color: inherit; font: inherit; font-size: 11px; cursor: pointer; }
      button:hover:not(:disabled) { background: rgba(var(--accent),.28); }
      button:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: -2px; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      #stop-btn:hover:not(:disabled) { background: rgba(255,110,110,.24); }
    </style>
  </head>
  <body>
    <div class="timer-content">
      <div class="timer-body">
        <span class="timer-title" id="timer-title">正在连接计时器…</span>
        <div class="timer-display" id="timer-display">0秒</div>
        <p class="timer-status" id="timer-status" role="status" aria-live="polite">等待主窗口</p>
      </div>
      <div class="timer-controls">
        <button id="pause-btn" type="button" aria-label="暂停计时" title="暂停计时" disabled>暂停</button>
        <button id="stop-btn" type="button" aria-label="停止并保存" title="停止并保存" disabled>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" /></svg>停止
        </button>
      </div>
    </div>
    <script src="./timer.js"></script>
  </body>
</html>
